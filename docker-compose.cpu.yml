# Тот же стек без видеокарты: для демонстрации на ноутбуке или на машине без NVIDIA-рантайма.
#
#     docker compose -f docker-compose.yml -f docker-compose.cpu.yml up --build
#
# Зачем отдельный файл. Основной compose резервирует GPU, и на машине без него запуск
# падает ещё до старта контейнера — «одна команда» перестаёт быть одной. Здесь резервация
# снимается и устройство переключается на CPU. Модель при этом та же и ответы те же;
# отличается только скорость: первый поиск занимает секунды, а не доли секунды.
services:
  api:
    environment:
      VREID_DEVICE: cpu
    # !reset — тег Docker Compose, который УДАЛЯЕТ поле из основного файла, а не
    # дописывает к нему. Без него списки сливаются и резервация GPU остаётся на месте.
    deploy: !reset null
  predict:
    deploy: !reset null
