name: falcontech-v2
services:
  db:
    image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: vreid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vreid}
      POSTGRES_DB: vreid
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - gallery-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U vreid -d vreid"]
      interval: 3s
      timeout: 5s
      retries: 30
  api:
    image: falcontech:2.0
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      VREID_DEVICE: ${VREID_DEVICE:-cuda}
      VREID_DATABASE_URL: postgresql://vreid:${POSTGRES_PASSWORD:-vreid}@db:5432/vreid
      VREID_API_KEY: ${VREID_API_KEY:-}
      VREID_DEMO_UI: ${VREID_DEMO_UI:-0}
    volumes:
      - gallery-files:/var/lib/vreid
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: 512m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health',timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s
  web:
    networks: [default, frontend]
    image: nginx@sha256:4ff102c5d78d254a6f0da062b3cf39eaf07f01eec0927fd21e219d0af8bc0591
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 127.0.0.1:${WEB_PORT:-8080}:8080
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  gallery-db:
  gallery-files:
networks:
  default:
    internal: true
  frontend:
    driver: bridge
