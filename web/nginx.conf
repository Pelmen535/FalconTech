# Тонкий клиент и единая точка входа (ТЗ §6: доступ через браузер, компоненты разделены).
# Статику отдаёт nginx, всё остальное уходит в контейнер инференса. Наружу торчит один порт.
server {
    listen 8080;
    server_name _;

    # Импорт галереи — это ZIP на сотню мегабайт и счёт векторов на стороне модели.
    client_max_body_size 160m;
    proxy_request_buffering off;

    add_header X-Content-Type-Options nosniff always;

    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location /static/ {
        root /usr/share/nginx/html;
        expires 1h;
    }

    # Всё, что относится к API и спецификации, обслуживает сервис инференса.
    location ~ ^/(v1|health|docs|openapi\.json) {
        proxy_pass http://api:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Извлечение векторов для большого архива на CPU занимает минуты: ждём, а не рвём.
        proxy_connect_timeout 15s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }
}
