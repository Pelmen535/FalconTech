# Проверки, которые должны проходить на любой машине, а не только на нашей.
# Запускается на каждый push и pull request. Ничего не публикует и никуда не деплоит.
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: тесты и проверки формата
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: зависимости
        run: |
          python -m pip install --upgrade pip
          # CPU-сборка torch: GPU в CI нет, а тестам он и не нужен.
          pip install torch==2.3.1 torchvision==0.18.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -r requirements-service.txt

      - name: pytest
        run: python -m pytest tests -q

      - name: фикстуры воспроизводятся побайтово
        # Входные CSV в tests/ синтетические (настоящие - это разметка организаторов, её
        # мы не публикуем). Скрипт с фиксированным seed обязан выдавать ровно то, что лежит
        # в репозитории: разойдётся - значит фикстуры правили руками, и тесты проверяют не то.
        run: |
          python scripts/make_test_fixtures.py
          git diff --exit-code tests/service/fixtures/inputs_csv

      - name: логи в UTF-8
        run: python scripts/normalize_logs.py

  image:
    name: сборка конкурсного образа
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Веса не лежат в репозитории: они отдаются как файлы GitHub Release, потому что
      # бесплатной квоты Git LFS (1 ГБ трафика в месяц) хватило бы на одно клонирование.
      # Этот шаг заодно проверяет, что скрипт скачивания рабочий и суммы сходятся.
      - name: веса из релиза
        run: python scripts/fetch_weights.py
      # Образ собирается ровно той командой, которую выполняет жюри. Внутри сборки
      # работают pip check, инвентаризация весов против лимита 2 ГБ и разбор рецепта,
      # поэтому успешная сборка — это уже содержательная проверка, а не формальность.
      - name: docker build
        run: docker build -t vreid:1.0 .
      - name: что реально установлено в образе
        run: docker run --rm --entrypoint python vreid:1.0 /app/scripts/image_report.py
